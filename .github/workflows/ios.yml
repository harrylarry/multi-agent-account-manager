name: Build unsigned iOS IPA

# Builds an UNSIGNED .ipa (no Apple Developer account needed) for sideloading
# via AltStore / Sideloadly / Xcode. Runs on pushes to main
# and on manual dispatch.
on:
  push:
    branches: ["main"]
    # Docs-only pushes (markdown + graph files) don't need a build.
    paths-ignore:
      - '**.md'
      - '.muse-graph/**'
  workflow_dispatch:
    inputs:
      spike:
        description: '构建 Spike 变体（bundle id com.ldjx.accountmanager.spike）'
        type: boolean
        default: false

# A new run on the same branch cancels the one still in progress,
# so rapid successive pushes only build the latest head.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      # 注入的 JS 不会经过 Xcode 的语法检查：先提取 + node --check，避免
      # 打出一个「能装但钩子从未运行」的包（见 2d39149 的 Scripts.swift）。
      - name: Verify embedded JavaScript
        run: npm run check:embedded-js
      # init must go through `npm run tauri` (never raw xcodebuild / xcodegen);
      # --skip-targets-install because the target is installed above.
      - run: npm run tauri -- ios init --ci --skip-targets-install
      # App icons are synced by tauri.ios.conf.json's beforeBuildCommand
      # (scripts/sync-ios-resources.mjs) before the Xcode build runs.
      # Spike 变体只覆盖 bundle id 与显示名，main 默认仍是日常版。
      # 双分支写法避免未加引号的变量展开（SC2086）。
      - name: Build unsigned IPA
        run: |
          if [ "${{ inputs.spike }}" = "true" ]; then
            npm run tauri -- ios build --no-sign --ci --config src-tauri/tauri.spike.conf.json
          else
            npm run tauri -- ios build --no-sign --ci
          fi
      - name: Locate unsigned IPA
        run: |
          ipa=$(find src-tauri/gen/apple -name '*.ipa' -type f | head -n 1)
          if [ -z "$ipa" ]; then
            echo "No .ipa found under src-tauri/gen/apple" >&2
            exit 1
          fi
          echo "Found IPA: $ipa"
          cp "$ipa" "$RUNNER_TEMP/account-manager-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/account-manager-ios-unsigned.ipa
          if-no-files-found: error
