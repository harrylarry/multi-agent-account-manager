[package]
name = "lmfpd-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Minimal lmfpd experiment: iOS-target compile + offline scoring, isolated from the app"

[dependencies]
lmfpd = "0.2"
serde_json = "1"

[[bin]]
name = "lmfpd-probe"
path = "src/main.rs"

[profile.dev]
debug = 0
