[package]
name = "multi-agent-account-manager"
version = "0.1.26"
edition = "2021"
rust-version = "1.85"

[lib]
name = "multi_agent_account_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-account-session = { path = "plugins/account-session" }
muse-native-client = { package = "muse-native", path = "muse-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
regex = "1"
ring = "0.17"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.6", features = ["unstable"] }
open = "5"
# socks feature：控制面 HTTP 走 socks5:// 代理需要（WSS 侧的 SOCKS5 在
# muse-native/proxy.rs 自行实现握手，与此无关）。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "socks"] }
sha2 = "0.10"

# Spike 0.1.22 (#3 认证链)：iOS 上控制面也需要 reqwest；用平台 native-tls
#（Security framework），与桌面端同一 TLS 栈，不引入新的 C 编译依赖。
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "socks"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
# #11/#16：代理口令写入系统 Keychain（Security.framework 的 generic password），
# `accounts.json` 只保留 credential_ref，不放明文密码。passwords 模块同时支持
# iOS 与 macOS。
security-framework = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSUUID", "NSString", "NSError", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com"] }

# iOS 27 launch-crash fix: wry 0.57.2's `platform_webview_version()` calls
# `NSBundle::bundleWithIdentifier("com.apple.WebKit")`, which traps inside
# CoreFoundation (CFRelease(NULL)) when the Tauri runtime calls it during
# startup, before UIApplicationMain has run. Upstream (0.57.3 and dev) still
# has the same call, so use a forked wry with that lookup replaced by
# `NSBundle::bundleForClass(WKWebView::class())` on iOS. The macOS path is
# unchanged. See harrylarry/wry branch ios-bundle-fix.
[patch.crates-io]
wry = { git = "https://github.com/harrylarry/wry", branch = "ios-bundle-fix" }

# 0.1.7: link-time optimization. The app is small, so the win is modest
# (cross-crate inlining + dead-code elimination, slightly smaller binary),
# at the cost of a slower link step on CI.
[profile.release]
lto = true
codegen-units = 1
