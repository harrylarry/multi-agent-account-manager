[package]
name = "diehao-manager-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]
test = false
doctest = false

[dependencies]
muse-native-client = { package = "muse-native", path = "../../src-tauri/muse-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
